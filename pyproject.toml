[project]
name = "drop"
version = "0.1.0"
description = "Share files at unlisted, protected or open URLs with a time-to-live"
readme = {file = "README.org", content-type = "text/org"}
authors = [
    { name = "Brett Viren", email = "brett.viren@gmail.com" }
]
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.1",
]

[project.scripts]
drop = "drop.cli:main"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
